<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Void Hunter</title>
<style>
:root{--cyan:#2ed8ff;--purple:#b06aff;--green:#39ff8a;--orange:#ff9a2e;--pink:#ff4e8a;--gold:#ffd166;--muted:rgba(180,200,230,.45);--font:'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070b;color:#e8f0ff;font-family:var(--font)}
canvas{display:block}
#ui{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px;pointer-events:none;background:linear-gradient(180deg,rgba(6,8,12,.9),transparent)}
.panel{pointer-events:auto;background:rgba(15,20,32,.85);border:1px solid rgba(46,216,255,.15);border-radius:10px;padding:6px 10px}
.label{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.val{font-size:16px;font-weight:700;color:var(--cyan);line-height:1.2}
.barBg{background:rgba(255,255,255,.08);border-radius:4px;height:6px;width:120px;margin-top:3px}
.bar{height:100%;border-radius:4px;transition:width .2s}
#hpBar{background:linear-gradient(90deg,#ff4e6a,#ff8a6a)}
#xpBar{background:linear-gradient(90deg,var(--purple),var(--cyan))}
.cluster{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
button{font-family:var(--font);cursor:pointer;border:none;outline:none}
.btn-primary{background:linear-gradient(135deg,rgba(46,216,255,.2),rgba(46,216,255,.08));border:1px solid rgba(46,216,255,.5);color:var(--cyan);border-radius:12px;padding:10px 22px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;transition:.2s}
.btn-primary:hover{background:rgba(46,216,255,.25);border-color:var(--cyan)}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.7);border-radius:12px;padding:10px 22px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;transition:.2s}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(4,6,10,.9);backdrop-filter:blur(10px)}
.overlay.hidden{display:none}
.box{background:linear-gradient(180deg,rgba(18,23,37,.98),rgba(12,15,25,.98));border:1px solid rgba(46,216,255,.14);border-radius:20px;padding:28px;width:min(560px,94vw);max-height:92vh;overflow-y:auto}
.hero{font-size:clamp(28px,5vw,42px);font-weight:900;letter-spacing:.18em;color:var(--cyan);text-shadow:0 0 30px rgba(46,216,255,.4)}
.sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.rarity-Common{color:#8ab4f8}.rarity-Rare{color:var(--purple)}.rarity-Epic{color:var(--gold)}.rarity-Legendary{color:#ff7043}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;margin-bottom:10px;transition:.2s}
.card:hover{border-color:rgba(46,216,255,.3);background:rgba(46,216,255,.04)}
.card h3{font-size:15px;color:#e8f0ff;margin:4px 0}
.card p{font-size:12px;color:var(--muted);margin-bottom:8px}
.card ul{list-style:none;font-size:11px;color:rgba(180,210,255,.6);line-height:1.8}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px;text-align:center}
.stat-box .sv{font-size:22px;font-weight:800;margin-top:4px}
.upg-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.upg-tag{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:3px 9px;font-size:11px;color:rgba(200,220,255,.7)}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(15,20,35,.95);border:1px solid rgba(46,216,255,.3);border-radius:10px;padding:8px 18px;font-size:13px;color:var(--cyan);z-index:200;opacity:0;transition:.3s;pointer-events:none}
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:14px}
.skin-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.2s}
.skin-card:hover{border-color:rgba(46,216,255,.4)}
.skin-card.active{border-color:var(--cyan);background:rgba(46,216,255,.08)}
.skin-color{width:36px;height:36px;border-radius:50%;margin:0 auto 8px;box-shadow:0 0 14px currentColor}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <div class="cluster">
    <div class="panel"><div class="label">Score</div><div class="val" id="scoreText">0</div></div>
    <div class="panel"><div class="label">Wave</div><div class="val" id="waveText">1</div></div>
    <div class="panel"><div class="label">Level</div><div class="val" id="levelText">1</div></div>
    <div class="panel"><div class="label">Credits</div><div class="val" id="creditText">0</div></div>
  </div>
  <div class="cluster">
    <div class="panel"><div class="label">Hull</div><div class="barBg"><div class="bar" id="hpBar" style="width:100%"></div></div></div>
    <div class="panel"><div class="label">XP</div><div class="barBg"><div class="bar" id="xpBar" style="width:0%"></div></div></div>
    <button class="btn-ghost panel" id="btnHangar" style="pointer-events:auto">Ангар</button>
  </div>
</div>

<!-- MENU -->
<div id="overlayMenu" class="overlay">
  <div class="box">
    <div class="hero">VOID HUNTER</div>
    <div class="sub">Bullet-heaven roguelike · v2.0</div>
    <div class="row">
      <button class="btn-primary" id="btnStart">Начать забег</button>
      <button class="btn-ghost" id="btnHangar2">Открыть ангар</button>
    </div>
  </div>
</div>

<!-- UPGRADE -->
<div id="overlayUpgrade" class="overlay hidden">
  <div class="box">
    <div class="hero" style="font-size:20px">ВЫБЕРИ УЛУЧШЕНИЕ</div>
    <div style="font-size:11px;color:var(--muted);margin-top:4px;margin-bottom:16px">Уровень <span id="upgLvl"></span></div>
    <div id="upgradeCards"></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px">
      <button class="btn-ghost" id="btnReroll" style="font-size:11px;padding:6px 14px">🔄 Реролл (<span id="rerollCount">1</span>)</button>
    </div>
  </div>
</div>

<!-- PAUSE -->
<div id="overlayPause" class="overlay hidden">
  <div class="box" style="text-align:center">
    <div class="hero" style="font-size:28px">ПАУЗА</div>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="btn-primary" id="btnResume">▶ Продолжить</button>
      <button class="btn-ghost" id="btnPauseHangar">Ангар</button>
    </div>
  </div>
</div>

<!-- HANGAR -->
<div id="overlayHangar" class="overlay hidden">
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="hero" style="font-size:22px">АНГАР</div>
      <button class="btn-ghost" id="btnHangarClose" style="padding:6px 14px">✕</button>
    </div>
    <div style="font-size:13px;color:var(--muted);margin-top:4px">Кредиты: <span id="hangarCredits" style="color:var(--gold)"></span></div>
    <div class="skin-grid" id="skinGrid"></div>
  </div>
</div>

<!-- STATS (end screen) -->
<div id="overlayStats" class="overlay hidden">
  <div class="box" style="text-align:center">
    <div style="font-size:11px;letter-spacing:.2em;color:var(--muted)">ЗАБЕГ ЗАВЕРШЁН</div>
    <div class="hero" style="margin-top:8px;font-size:22px" id="statsName"></div>
    <div style="font-size:52px;font-weight:900;color:var(--gold);margin:8px 0;text-shadow:0 0 30px rgba(255,209,102,.4)" id="statsScore"></div>
    <div class="stat-grid">
      <div class="stat-box"><div class="label">Волна</div><div class="sv" style="color:var(--purple)" id="statsWave"></div></div>
      <div class="stat-box"><div class="label">Уровень</div><div class="sv" style="color:var(--green)" id="statsLevel"></div></div>
      <div class="stat-box"><div class="label">Кредиты</div><div class="sv" style="color:var(--orange)" id="statsCredits"></div></div>
    </div>
    <div id="statsTags" class="upg-tags" style="justify-content:center"></div>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="btn-primary" id="btnStatsRestart">🔄 Ещё раз</button>
      <button class="btn-ghost" id="btnStatsMenu">🏠 Меню</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── CANVAS ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ── UTILS ────────────────────────────────────────────────────────────────────
const rnd  = (a,b)=>Math.random()*(b-a)+a;
const dist = (x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.opacity=1;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.opacity=0, 1800);
}

// ── META (persistent) ────────────────────────────────────────────────────────
const meta={bankCredits:0,selectedSkin:'classic'};

// ── SKINS ────────────────────────────────────────────────────────────────────
const SKINS=[
  {id:'classic', name:'Azure',    col:'#2ed8ff', price:0,   owned:true},
  {id:'crimson', name:'Crimson',  col:'#ff4e6a', price:120, owned:false},
  {id:'gold',    name:'Gold',     col:'#ffd166', price:200, owned:false},
  {id:'green',   name:'Venom',    col:'#39ff8a', price:150, owned:false},
  {id:'purple',  name:'Void',     col:'#b06aff', price:300, owned:false},
];

// ── GAME STATE ───────────────────────────────────────────────────────────────
const G={
  state:'menu', // menu | playing | upgrade | pause | stats
  frame:0, score:0, wave:1, level:1, xp:0, xpNext:28, runCredits:0,
  rerolls:1, lastUpgIds:[],
  stars:[], bullets:[], eBullets:[], enemies:[], gems:[], particles:[],
  keys:{},
  player:null,
  spawnCd:40,
};

function xpForLevel(lv){return Math.floor(28*Math.pow(1.18,lv-1));}

function initStars(){
  G.stars=[];
  for(let i=0;i<160;i++) G.stars.push({x:rnd(0,canvas.width),y:rnd(0,canvas.height),r:rnd(.3,1.6),s:rnd(.12,.55),a:rnd(.2,.9)});
}

function newPlayer(){
  const skin=SKINS.find(s=>s.id===meta.selectedSkin)||SKINS[0];
  return {
    x:canvas.width/2, y:canvas.height-100,
    col:skin.col,
    hp:100, maxHp:100,
    moveSpeed:3.2, bulletSpeed:7.5, bulletSize:4,
    shootRate:10, shootCd:0,
    damage:1.4, pierce:0, extraShots:0, ricochet:0, chain:0,
    critChance:0, critDmg:1.8,
    pickupRange:56,
    armor:0, dodge:0,
    lifesteal:0, freeze:0, poison:0, poisonDmg:0,
    aura:0, drone:0, droneCd:0, orbital:0, orbAngle:0,
    maxShield:0, shield:0, shieldCd:0,
    regenLv:0, regenTimer:0,
    xpGain:1, creditGain:1,
    tags:new Set(),
    trail:[],
  };
}

function resetRun(){
  G.score=0; G.wave=1; G.frame=0; G.level=1;
  G.xp=0; G.xpNext=xpForLevel(1);
  G.runCredits=0; G.rerolls=1; G.lastUpgIds=[];
  G.bullets=[]; G.eBullets=[]; G.enemies=[]; G.gems=[]; G.particles=[];
  G.spawnCd=90;
  initStars();
  G.player=newPlayer();
}

// ── UPGRADES ─────────────────────────────────────────────────────────────────
const UPGRADES=[
  // DAMAGE
  {id:'dmg1',     name:'Усиленные патроны',   rar:'Common',   desc:'Больше урона.',
   w:p=>8+(p.damage<2?4:0), apply:p=>{p.damage+=0.4;}},
  {id:'dmg2',     name:'Бронебойный заряд',   rar:'Rare',     desc:'Большая пуля, +урон, -скорость пули.',
   w:p=>4+(p.bulletSize<7?3:0), apply:p=>{p.damage+=0.6;p.bulletSize+=1.2;p.bulletSpeed=Math.max(4,p.bulletSpeed-1.5);}},
  {id:'crit',     name:'Прицел охотника',     rar:'Rare',     desc:'+15% крит.',
   w:p=>5+(p.critChance<.3?4:0), apply:p=>{p.critChance=Math.min(.5,p.critChance+.15);}},
  {id:'critdmg',  name:'Смертельный удар',    rar:'Epic',     desc:'+0.4 крит урон.',
   w:p=>3+(p.critDmg<2.5?4:0), apply:p=>{p.critDmg+=0.4;}},

  // BULLETS
  {id:'pierce',   name:'Сквозной выстрел',    rar:'Rare',     desc:'+1 пробитие.',
   w:p=>5+(p.pierce<2?5:0), apply:p=>{p.pierce=Math.min(5,p.pierce+1);}},
  {id:'ricochet', name:'Рикошет',             rar:'Rare',     desc:'Пули отскакивают к соседней цели.',
   w:p=>4+(p.ricochet<2?6:0), apply:p=>{p.ricochet=Math.min(3,p.ricochet+1);}},
  {id:'extrashot',name:'Двойной выстрел',     rar:'Rare',     desc:'+1 дополнительная пуля.',
   w:p=>5+(p.extraShots<2?5:0), apply:p=>{p.extraShots=Math.min(4,p.extraShots+1);}},
  {id:'spread',   name:'Веерный огонь',       rar:'Rare',     desc:'+2 боковых пули.',
   w:p=>4+(p.extraShots<3?4:0), apply:p=>{p.extraShots=Math.min(5,p.extraShots+2);}},
  {id:'rapid',    name:'Шквальный огонь',     rar:'Rare',     desc:'Быстрее стреляет, -20% урон.',
   w:p=>5+(p.shootRate>7?4:0), apply:p=>{p.shootRate=Math.max(4,p.shootRate-3);p.damage=Math.max(.5,p.damage*.85);}},
  {id:'sniper',   name:'Снайпер',             rar:'Rare',     desc:'+урон, +скорость пули, +пробитие.',
   w:p=>4, apply:p=>{p.damage+=0.5;p.bulletSpeed+=2.5;p.pierce=Math.min(5,p.pierce+1);}},
  {id:'burst',    name:'Очередь',             rar:'Epic',     desc:'+2 пули, -15% урон.',
   w:p=>3+(p.extraShots<2?4:0), apply:p=>{p.extraShots=Math.min(5,p.extraShots+2);p.damage=Math.max(.5,p.damage*.85);}},
  {id:'homing',   name:'Самонаводящиеся',     rar:'Epic',     desc:'Пули агрессивно преследуют врагов.',
   w:p=>3+(!p.tags.has('homing')?5:0), apply:p=>{p.tags.add('homing');}},
  {id:'micro',    name:'Микропули',           rar:'Rare',     desc:'+2 пули, меньше и быстрее.',
   w:p=>4+(p.extraShots<3?4:0), apply:p=>{p.extraShots=Math.min(5,p.extraShots+2);p.bulletSize=Math.max(2,p.bulletSize-.8);p.bulletSpeed+=1.5;}},

  // SPEED / SURVIVAL
  {id:'speed',    name:'Форсаж',              rar:'Common',   desc:'+0.5 скорость.',
   w:p=>7+(p.moveSpeed<5?3:0), apply:p=>{p.moveSpeed=Math.min(6,p.moveSpeed+.5);}},
  {id:'hp',       name:'Броня',               rar:'Common',   desc:'+30 HP.',
   w:p=>7+(p.hp<60?6:0), apply:p=>{p.maxHp+=30;p.hp=Math.min(p.maxHp,p.hp+30);}},
  {id:'regen',    name:'Регенерация',         rar:'Rare',     desc:'Медленно восстанавливает HP.',
   w:p=>4+(p.regenLv<1?5:0), apply:p=>{p.regenLv=Math.min(3,p.regenLv+1);}},
  {id:'shield',   name:'Щит',                 rar:'Epic',     desc:'+1 щит (поглощает удар).',
   w:p=>3+(p.maxShield<2?5:0), apply:p=>{p.maxShield+=1;p.shield=Math.min(p.maxShield,p.shield+1);}},
  {id:'lifesteal',name:'Вампиризм',           rar:'Epic',     desc:'Восстанавливает HP от урона.',
   w:p=>3+(p.lifesteal<1?5:0), apply:p=>{p.lifesteal=Math.min(2,p.lifesteal+.5);}},
  {id:'dodge',    name:'Уклонение',           rar:'Rare',     desc:'+12% шанс уклонения.',
   w:p=>4+(p.dodge<.3?4:0), apply:p=>{p.dodge=Math.min(.5,p.dodge+.12);}},

  // SPECIAL
  {id:'freeze',   name:'Криопатрон',          rar:'Rare',     desc:'Пули замораживают врагов.',
   w:p=>4+(p.freeze<1?5:0), apply:p=>{p.freeze=Math.min(1,p.freeze+.35);}},
  {id:'poison',   name:'Яд',                  rar:'Rare',     desc:'Пули отравляют врагов.',
   w:p=>4+(p.poison<1?5:0), apply:p=>{p.poison=Math.min(1,p.poison+.4);p.poisonDmg=.3;}},
  {id:'aura',     name:'Аура урона',          rar:'Epic',     desc:'Наносит урон рядом с игроком.',
   w:p=>3+(p.aura<1?5:0), apply:p=>{p.aura=Math.min(80,p.aura+40);}},
  {id:'drone',    name:'Дрон',                rar:'Epic',     desc:'+1 дрон-помощник.',
   w:p=>3+(p.drone<2?5:0), apply:p=>{p.drone=Math.min(3,p.drone+1);}},
  {id:'pickup',   name:'Магнит',              rar:'Common',   desc:'+30 радиус сбора.',
   w:p=>6+(p.pickupRange<80?4:0), apply:p=>{p.pickupRange=Math.min(120,p.pickupRange+30);}},
  {id:'xpboost',  name:'Сканер XP',           rar:'Common',   desc:'Больше опыта.',
   w:p=>6+(p.xpGain<1.5?4:0), apply:p=>{p.xpGain=Math.min(2,p.xpGain+.3);}},
  {id:'economy',  name:'Трофейный сбор',      rar:'Rare',     desc:'Больше кредитов.',
   w:p=>4+(p.creditGain<1.5?4:0), apply:p=>{p.creditGain=Math.min(2.5,p.creditGain+.4);}},
  {id:'chain',    name:'Цепной разряд',       rar:'Epic',     desc:'Поражает соседних врагов.',
   w:p=>3+(p.chain<1?5:0), apply:p=>{p.chain=Math.min(2,p.chain+1);}},
  {id:'glasscannon',name:'Стеклянная пушка',  rar:'Legendary',desc:'+80% урон, -40% HP.',
   w:p=>1+(!p.tags.has('glass')?4:0), apply:p=>{p.damage*=1.8;p.maxHp=Math.max(20,Math.floor(p.maxHp*.6));p.hp=Math.min(p.hp,p.maxHp);p.tags.add('glass');}},
];

function weightedPick(pool){
  if(!pool||!pool.length) return null;
  const total=pool.reduce((s,x)=>s+x.w,0);
  if(!total) return pool[Math.floor(Math.random()*pool.length)];
  let r=Math.random()*total;
  for(const x of pool){r-=x.w;if(r<=0)return x;}
  return pool[pool.length-1];
}

function pickUpgrades(){
  const picked=[]; const used=new Set();
  for(let i=0;i<3;i++){
    const pool=UPGRADES
      .filter(u=>!used.has(u.id))
      .map(u=>({...u,w:u.w(G.player)}))
      .filter(u=>u.w>0);
    const pick=weightedPick(pool);
    if(pick){picked.push(pick);used.add(pick.id);}
  }
  return picked;
}

function showUpgrade(){
  if(G.state!=='playing') return;
  G.state='upgrade';
  const cards=pickUpgrades();
  document.getElementById('upgLvl').textContent=G.level;
  document.getElementById('rerollCount').textContent=G.rerolls;
  const container=document.getElementById('upgradeCards');
  container.innerHTML='';
  if(!cards.length){G.state='playing';return;}
  for(const u of cards){
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<div class="rarity-${u.rar}" style="font-size:10px;letter-spacing:.1em">${u.rar.toUpperCase()}</div>
      <h3>${u.name}</h3><p>${u.desc}</p>`;
    const btn=document.createElement('button');
    btn.className='btn-primary';
    btn.style.cssText='width:100%;margin-top:8px;padding:8px';
    btn.textContent='Выбрать';
    btn.addEventListener('click',()=>{
      u.apply(G.player);
      if(G.player.maxShield&&G.player.shield<1)G.player.shield=1;
      document.getElementById('overlayUpgrade').classList.add('hidden');
      G.state='playing';
      toast(u.name);
    });
    div.appendChild(btn);
    container.appendChild(div);
  }
  document.getElementById('overlayUpgrade').classList.remove('hidden');
}

// ── SHOOTING ─────────────────────────────────────────────────────────────────
function shoot(){
  const p=G.player;
  // Auto-aim at nearest enemy (Vampire Survivor style)
  let target=null, minD=1e9;
  for(const e of G.enemies){
    const d=dist(p.x,p.y,e.x,e.y);
    if(d<minD){minD=d;target=e;}
  }
  // If no enemy, shoot upward
  const baseAng=target?Math.atan2(target.y-p.y,target.x-p.x):-Math.PI/2;
  const count=1+p.extraShots;
  const step=count>1?0.22:0;
  for(let i=0;i<count;i++){
    const ang=baseAng+(i-(count-1)/2)*step;
    const crit=Math.random()<p.critChance?p.critDmg:1;
    const col=p.freeze>0?'#a0e8ff':p.poison>0?'#80ff80':p.col;
    G.bullets.push({
      x:p.x, y:p.y,
      vx:Math.cos(ang)*p.bulletSpeed,
      vy:Math.sin(ang)*p.bulletSpeed,
      r:p.bulletSize, pierce:p.pierce,
      dmg:p.damage*crit,
      col, ricochet:p.ricochet, chain:p.chain,
      homing:p.tags.has('homing'),
    });
  }
}

// ── SPAWN ─────────────────────────────────────────────────────────────────────
function spawnEnemy(){
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=rnd(0,canvas.width);y=-50;}
  else if(side===1){x=canvas.width+50;y=rnd(0,canvas.height);}
  else if(side===2){x=rnd(0,canvas.width);y=canvas.height+50;}
  else{x=-50;y=rnd(0,canvas.height);}
  const wv=G.wave;

  // Boss every 5 waves (frame-based: 2400*5=12000)
  if(G.frame>0 && G.frame%12000===0){
    spawnBoss(x,y,wv); return;
  }
  // Mini-boss every 2 waves
  if(G.frame>0 && G.frame%4800===0){
    spawnMiniBoss(x,y,wv); return;
  }

  const t=Math.random();
  if(t<.55){
    // Grunt — tiny, fast, 1 green XP gem
    G.enemies.push({x,y,type:'grunt',
      hp:4+wv*1.8, maxHp:4+wv*1.8, r:10, spd:1.1+wv*.07,
      dmg:7, score:8+wv, col:'#ff6b6b',
      xpTier:0, // green small
      creditChance:.08,
      frozen:0,poison:0,poisonTimer:0, angle:0});
  } else if(t<.78){
    // Brute — slow tank, 1 blue XP gem (worth more)
    const hp=wv<3?12:18+wv*3.5;
    G.enemies.push({x,y,type:'brute',
      hp, maxHp:hp, r:19, spd:.55+wv*.03,
      dmg:13, score:22+wv*2, col:'#ff9a2e',
      xpTier:1, // blue medium
      creditChance:.2,
      frozen:0,poison:0,poisonTimer:0, angle:0});
  } else if(t<.92){
    // Dasher — zigzag mover
    G.enemies.push({x,y,type:'dasher',
      hp:3+wv, maxHp:3+wv, r:9, spd:0, baseDashSpd:2.2+wv*.1,
      dmg:6, score:10+wv, col:'#ff4e8a',
      xpTier:0,
      creditChance:.05,
      frozen:0,poison:0,poisonTimer:0,
      dashTimer:0, dashAngle:Math.atan2(G.player.y-y,G.player.x-x), angle:0});
  } else {
    // Shooter — stops and fires projectiles (wave 4+)
    if(wv<4){
      G.enemies.push({x,y,type:'grunt',hp:4+wv*1.8,maxHp:4+wv*1.8,r:10,spd:1.1+wv*.07,dmg:7,score:8+wv,col:'#ff6b6b',xpTier:0,creditChance:.08,frozen:0,poison:0,poisonTimer:0,angle:0});
    } else {
      G.enemies.push({x,y,type:'shooter',
        hp:12+wv*2, maxHp:12+wv*2, r:14, spd:.7+wv*.03,
        dmg:10, score:18+wv*2, col:'#c084fc',
        xpTier:1,
        creditChance:.25,
        frozen:0,poison:0,poisonTimer:0,
        shootCd:0, angle:0});
    }
  }
}

function spawnMiniBoss(x,y,wv){
  const types=['charger','spinner'];
  const t=types[Math.floor(Math.random()*types.length)];
  if(t==='charger'){
    G.enemies.push({x,y,type:'charger',
      hp:60+wv*15, maxHp:60+wv*15, r:22, spd:0,
      dmg:20, score:80+wv*8, col:'#fb923c',
      xpTier:2, // gold large
      creditChance:1,
      frozen:0,poison:0,poisonTimer:0,
      chargeTimer:0, chargePhase:'wait', chargeVx:0, chargeVy:0, angle:0,
      miniboss:true});
  } else {
    G.enemies.push({x,y,type:'spinner',
      hp:50+wv*12, maxHp:50+wv*12, r:20, spd:.5+wv*.03,
      dmg:15, score:70+wv*7, col:'#a78bfa',
      xpTier:2,
      creditChance:1,
      frozen:0,poison:0,poisonTimer:0,
      spinAngle:0, shootCd:0, angle:0,
      miniboss:true});
  }
}

function spawnBoss(x,y,wv){
  const types=['titan','hydra','ghost'];
  const t=types[Math.floor(wv/5)%3];
  if(t==='titan'){
    G.enemies.push({x,y,type:'titan',
      hp:200+wv*30, maxHp:200+wv*30, r:38, spd:.45+wv*.02,
      dmg:25, score:300+wv*20, col:'#ef4444',
      xpTier:3, // rainbow
      creditChance:1,
      frozen:0,poison:0,poisonTimer:0,
      shootCd:0, angle:0, boss:true});
  } else if(t==='hydra'){
    G.enemies.push({x,y,type:'hydra',
      hp:180+wv*25, maxHp:180+wv*25, r:34, spd:.35+wv*.02,
      dmg:20, score:280+wv*20, col:'#10b981',
      xpTier:3,
      creditChance:1,
      frozen:0,poison:0,poisonTimer:0,
      shootCd:0, angle:0, splitDone:false, boss:true});
  } else {
    G.enemies.push({x,y,type:'ghost',
      hp:160+wv*20, maxHp:160+wv*20, r:30, spd:1.2+wv*.04,
      dmg:18, score:250+wv*20, col:'#67e8f9',
      xpTier:3,
      creditChance:1,
      frozen:0,poison:0,poisonTimer:0,
      alpha:1, phaseTimer:0, angle:0, boss:true});
  }
}

// ── GAIN XP ───────────────────────────────────────────────────────────────────
function gainXp(amount){
  if(!G.player) return;
  G.xp+=amount*G.player.xpGain;
  if(G.xp>=G.xpNext && G.state==='playing'){
    G.xp-=G.xpNext;
    G.level++;
    G.xpNext=xpForLevel(G.level);
    showUpgrade();
  }
}

// ── UPDATE ────────────────────────────────────────────────────────────────────
function update(){
  if(G.state!=='playing') return;
  G.frame++;
  const p=G.player;

  // stars
  for(const s of G.stars){s.y+=s.s;if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}}

  // player movement
  const jx=window._jx?window._jx():0, jy=window._jy?window._jy():0;
  const kd=G.keys;
  let dx=Math.abs(jx)>.05?jx:((kd['d']||kd['arrowright'])?1:0)-((kd['a']||kd['arrowleft'])?1:0);
  let dy=Math.abs(jy)>.05?jy:((kd['s']||kd['arrowdown'])?1:0)-((kd['w']||kd['arrowup'])?1:0);
  const len=Math.hypot(dx,dy)||1;
  if(Math.hypot(dx,dy)>0){dx/=len;dy/=len;}
  p.x=Math.max(20,Math.min(canvas.width-20, p.x+dx*p.moveSpeed));
  p.y=Math.max(20,Math.min(canvas.height-20,p.y+dy*p.moveSpeed));
  // Track facing angle - only update when actually moving
  if(Math.hypot(dx,dy)>0.05){
    const targetAngle=Math.atan2(dy,dx)+Math.PI/2; // +90° because ship points up by default
    // Smooth rotation
    let da=targetAngle-(p.facing||(-Math.PI/2));
    if(da>Math.PI)da-=Math.PI*2;
    if(da<-Math.PI)da+=Math.PI*2;
    p.facing=(p.facing||(-Math.PI/2))+da*0.18;
  }

  // trail
  p.trail.push({x:p.x,y:p.y});
  if(p.trail.length>18)p.trail.shift();

  // regen
  if(p.regenLv>0){p.regenTimer++;if(p.regenTimer>=180/p.regenLv){p.regenTimer=0;p.hp=Math.min(p.maxHp,p.hp+1);}}

  // shield regen
  if(p.maxShield>0&&p.shield<p.maxShield){p.shieldCd++;if(p.shieldCd>300){p.shield++;p.shieldCd=0;}}

  // shoot
  p.shootCd--;
  if(p.shootCd<=0){shoot();p.shootCd=p.shootRate;}

  // spawn
  G.spawnCd--;
  if(G.spawnCd<=0){
    // Slow start: wave 1=90 frames, gradually drops to min 18 by wave 15+
    const rate=Math.max(14, 80-G.wave*5);
    G.spawnCd=rate;
    // Only 1 enemy at a time early on, more later
    const count=1+Math.floor(G.wave/6);
    for(let i=0;i<count;i++) spawnEnemy();
  }
  if(G.frame%1800===0) G.wave++;

  // move bullets
  for(const b of G.bullets){
    if(b.homing&&G.enemies.length){
      let closest=G.enemies[0],cd=1e9;
      for(const e of G.enemies){const d=dist(b.x,b.y,e.x,e.y);if(d<cd){cd=d;closest=e;}}
      const ta=Math.atan2(closest.y-b.y,closest.x-b.x);
      const ca=Math.atan2(b.vy,b.vx);
      let da=ta-ca;
      if(da>Math.PI)da-=Math.PI*2;
      if(da<-Math.PI)da+=Math.PI*2;
      const na=ca+da*.18; // tighter homing vs base auto-aim
      const sp=Math.hypot(b.vx,b.vy);
      b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
    }
    b.x+=b.vx;b.y+=b.vy;
  }

  // move enemy bullets
  for(const b of G.eBullets){b.x+=b.vx;b.y+=b.vy;}

  // move enemies with type-specific AI
  for(const e of G.enemies){
    e.angle=(e.angle||0)+.05; // base rotation for animation
    if(e.frozen>0){e.frozen--;continue;}
    if(e.poisonTimer>0){e.poisonTimer--;e.hp-=e.poison||0;if(e.hp<=0)e.hp=0;}
    const toAng=Math.atan2(p.y-e.y,p.x-e.x);

    if(e.type==='grunt'||e.type==='brute'){
      e.x+=Math.cos(toAng)*e.spd;
      e.y+=Math.sin(toAng)*e.spd;

    } else if(e.type==='dasher'){
      e.dashTimer=(e.dashTimer||0)+1;
      if(e.dashTimer<20){
        // zigzag dash
        const perp=e.dashAngle+Math.PI/2;
        const z=Math.sin(e.dashTimer*.5)*1.5;
        e.x+=Math.cos(e.dashAngle)*e.baseDashSpd+Math.cos(perp)*z;
        e.y+=Math.sin(e.dashAngle)*e.baseDashSpd+Math.sin(perp)*z;
      } else if(e.dashTimer<35){
        // pause and re-aim
      } else {
        e.dashTimer=0;
        e.dashAngle=Math.atan2(p.y-e.y,p.x-e.x)+rnd(-.4,.4);
      }

    } else if(e.type==='shooter'){
      // stay at mid-range, orbit slightly
      const d=dist(e.x,e.y,p.x,p.y);
      if(d>220){e.x+=Math.cos(toAng)*e.spd;e.y+=Math.sin(toAng)*e.spd;}
      else if(d<140){e.x-=Math.cos(toAng)*e.spd*.6;e.y-=Math.sin(toAng)*e.spd*.6;}
      e.shootCd=(e.shootCd||0)+1;
      if(e.shootCd>=80){
        e.shootCd=0;
        const ba=Math.atan2(p.y-e.y,p.x-e.x);
        for(let i=-1;i<=1;i++){
          G.eBullets.push({x:e.x,y:e.y,vx:Math.cos(ba+i*.25)*3.5,vy:Math.sin(ba+i*.25)*3.5,dmg:8,r:6});
        }
      }

    } else if(e.type==='charger'){
      e.chargeTimer=(e.chargeTimer||0)+1;
      if(e.chargePhase==='wait'){
        if(e.chargeTimer>60){
          e.chargePhase='wind'; e.chargeTimer=0;
          e.chargeVx=Math.cos(toAng)*12; e.chargeVy=Math.sin(toAng)*12;
        }
      } else if(e.chargePhase==='wind'){
        if(e.chargeTimer>30){e.chargePhase='charge';e.chargeTimer=0;}
      } else if(e.chargePhase==='charge'){
        e.x+=e.chargeVx; e.y+=e.chargeVy;
        e.chargeVx*=.92; e.chargeVy*=.92;
        if(e.chargeTimer>25){e.chargePhase='wait';e.chargeTimer=0;}
      }

    } else if(e.type==='spinner'){
      e.spinAngle=(e.spinAngle||0)+.05;
      e.x+=Math.cos(toAng)*e.spd;
      e.y+=Math.sin(toAng)*e.spd;
      e.shootCd=(e.shootCd||0)+1;
      if(e.shootCd>=50){
        e.shootCd=0;
        for(let i=0;i<6;i++){
          const ba=e.spinAngle+i*(Math.PI*2/6);
          G.eBullets.push({x:e.x,y:e.y,vx:Math.cos(ba)*2.8,vy:Math.sin(ba)*2.8,dmg:7,r:5});
        }
      }

    } else if(e.type==='titan'){
      e.x+=Math.cos(toAng)*e.spd;
      e.y+=Math.sin(toAng)*e.spd;
      e.shootCd=(e.shootCd||0)+1;
      if(e.shootCd>=45){
        e.shootCd=0;
        const ba=Math.atan2(p.y-e.y,p.x-e.x);
        for(let i=-2;i<=2;i++){
          G.eBullets.push({x:e.x,y:e.y,vx:Math.cos(ba+i*.2)*4,vy:Math.sin(ba+i*.2)*4,dmg:12,r:7});
        }
      }

    } else if(e.type==='hydra'){
      e.x+=Math.cos(toAng)*e.spd;
      e.y+=Math.sin(toAng)*e.spd;
      // Split into 2 minions at 50% HP
      if(!e.splitDone && e.hp<=e.maxHp*.5){
        e.splitDone=true;
        for(let i=0;i<2;i++){
          G.enemies.push({x:e.x+rnd(-30,30),y:e.y+rnd(-30,30),type:'brute',
            hp:e.maxHp*.25,maxHp:e.maxHp*.25,r:15,spd:.8,dmg:12,score:40,
            col:'#34d399',xpTier:1,creditChance:.5,
            frozen:0,poison:0,poisonTimer:0,angle:0});
        }
      }
      e.shootCd=(e.shootCd||0)+1;
      if(e.shootCd>=60){
        e.shootCd=0;
        for(let i=0;i<8;i++){
          const ba=i*(Math.PI*2/8);
          G.eBullets.push({x:e.x,y:e.y,vx:Math.cos(ba)*3,vy:Math.sin(ba)*3,dmg:10,r:6});
        }
      }

    } else if(e.type==='ghost'){
      // Phases in/out and teleports near player
      e.phaseTimer=(e.phaseTimer||0)+1;
      if(e.phaseTimer<60){e.alpha=e.phaseTimer/60;e.x+=Math.cos(toAng)*e.spd;e.y+=Math.sin(toAng)*e.spd;}
      else if(e.phaseTimer<90){e.alpha=1-(e.phaseTimer-60)/30;}
      else if(e.phaseTimer===90){
        // teleport near player
        const ta=rnd(0,Math.PI*2);
        e.x=p.x+Math.cos(ta)*rnd(120,200);
        e.y=p.y+Math.sin(ta)*rnd(120,200);
        e.phaseTimer=0;
      }
    }
  }

  // aura damage
  if(p.aura>0){
    for(const e of G.enemies){if(dist(p.x,p.y,e.x,e.y)<p.aura){e.hp-=.15;}}
  }

  // drone attack
  if(p.drone>0){
    p.droneCd=(p.droneCd||0)+1;
    if(p.droneCd>=30&&G.enemies.length){
      p.droneCd=0;
      const tgt=G.enemies.reduce((a,e)=>dist(p.x,p.y,e.x,e.y)<dist(p.x,p.y,a.x,a.y)?e:a,G.enemies[0]);
      const da2=Math.atan2(tgt.y-p.y,tgt.x-p.x);
      for(let d=0;d<p.drone;d++){
        G.bullets.push({x:p.x,y:p.y,vx:Math.cos(da2+rnd(-.2,.2))*8,vy:Math.sin(da2+rnd(-.2,.2))*8,r:3,pierce:0,dmg:p.damage*.6,col:'#ffd166',ricochet:0,chain:0,homing:false});
      }
    }
  }

  // bullet-enemy collision
  for(const b of G.bullets){
    for(const e of G.enemies){
      if(dist(b.x,b.y,e.x,e.y)<e.r+b.r){
        e.hp-=b.dmg;
        if(p.lifesteal>0) p.hp=Math.min(p.maxHp,p.hp+b.dmg*p.lifesteal*.06);
        if(p.freeze>0&&Math.random()<p.freeze) e.frozen=80;
        if(p.poison>0){e.poison=p.poisonDmg;e.poisonTimer=120;}
        if(b.chain>0){
          for(const e2 of G.enemies){if(e2!==e&&dist(e.x,e.y,e2.x,e2.y)<90){e2.hp-=b.dmg*.35;break;}}
        }
        if(b.ricochet>0){
          let nxt=null,nd=1e9;
          for(const e2 of G.enemies){if(e2!==e){const d=dist(b.x,b.y,e2.x,e2.y);if(d<nd&&d<300){nd=d;nxt=e2;}}}
          if(nxt){const ra=Math.atan2(nxt.y-b.y,nxt.x-b.x);b.vx=Math.cos(ra)*p.bulletSpeed;b.vy=Math.sin(ra)*p.bulletSpeed;b.ricochet--;continue;}
        }
        for(let i=0;i<3;i++) G.particles.push({x:b.x,y:b.y,vx:rnd(-1.5,1.5),vy:rnd(-1.5,1.5),life:1,col:e.col,r:rnd(1,2.5)});
        b.pierce--;
        break;
      }
    }
  }

  // enemy hits player
  for(const e of G.enemies){
    if(dist(p.x,p.y,e.x,e.y)<e.r+14){
      if(Math.random()<p.dodge) continue;
      if(p.shield>0){p.shield--;p.shieldCd=0;continue;}
      p.hp-=e.dmg*(1-p.armor*.1);
      e.hp=-999;
      for(let i=0;i<6;i++) G.particles.push({x:p.x,y:p.y,vx:rnd(-2,2),vy:rnd(-2,2),life:1,col:'#ff4e6a',r:rnd(2,4)});
      if(p.hp<=0){endRun();return;}
    }
  }

  // enemy bullet hits player
  for(const b of G.eBullets){
    if(dist(p.x,p.y,b.x,b.y)<16){
      if(Math.random()<p.dodge) continue;
      if(p.shield>0){p.shield--;p.shieldCd=0;}
      else{p.hp-=b.dmg;if(p.hp<=0){endRun();return;}}
      b.dead=true;
    }
  }

  // collect gems
  for(const g of G.gems){
    g.x+=g.vx;g.y+=g.vy;g.vx*=.92;g.vy*=.92;
    const d=dist(g.x,g.y,p.x,p.y);
    if(d<p.pickupRange){
      const fa=Math.atan2(p.y-g.y,p.x-g.x);
      const force=1+(1-d/p.pickupRange)*2.5;
      g.vx+=Math.cos(fa)*force;g.vy+=Math.sin(fa)*force;
    }
    if(d<16){
      g.dead=true;
      if(g.type==='xp') gainXp(g.val);
      else{G.runCredits+=g.val*p.creditGain;meta.bankCredits+=g.val*p.creditGain;}
      if(G.state!=='playing') break;
    }
  }

  // kill enemies & spawn drops
  for(const e of G.enemies){
    if(e.hp<=0){
      G.score+=e.score;
      const pc=e.boss?10:e.miniboss?7:5;
      for(let i=0;i<pc;i++) G.particles.push({x:e.x,y:e.y,vx:rnd(-3,3),vy:rnd(-3,3),life:1,col:e.col,r:rnd(1,3.5)});

      // XP gems by tier:
      // tier0=green small (1xp), tier1=blue medium (4xp), tier2=gold large (12xp), tier3=rainbow (30xp)
      const XP_TIERS=[
        {val:1,   col:'#4ade80', r:4,  label:'xp'},
        {val:4,   col:'#60a5fa', r:6,  label:'xp'},
        {val:12,  col:'#fbbf24', r:8,  label:'xp'},
        {val:30,  col:'#f0abfc', r:10, label:'xp'},
      ];
      const tier=XP_TIERS[Math.min(e.xpTier||0, 3)];
      // bosses/minibosses drop multiple gems
      const gemCount=e.boss?6:e.miniboss?3:1;
      for(let i=0;i<gemCount;i++){
        G.gems.push({x:e.x+rnd(-10,10),y:e.y+rnd(-10,10),
          vx:rnd(-1.5,1.5),vy:rnd(-2,0),
          val:tier.val, type:'xp', r:tier.r, col:tier.col, dead:false});
      }

      // Credits drop separately as coin
      if(Math.random()<(e.creditChance||.1)){
        const coinVal=e.boss?8:e.miniboss?4:Math.random()<.3?2:1;
        G.gems.push({x:e.x,y:e.y,vx:rnd(-1,1),vy:rnd(-1.5,.5),
          val:coinVal, type:'credit', r:6, col:'#fcd34d', dead:false, spin:0});
      }
    }
  }

  // cleanup
  G.bullets  =G.bullets.filter(b=>b.pierce>=0&&b.x>-20&&b.x<canvas.width+20&&b.y>-20&&b.y<canvas.height+20);
  G.eBullets =G.eBullets.filter(b=>!b.dead&&b.x>-20&&b.x<canvas.width+20&&b.y>-20&&b.y<canvas.height+20);
  G.enemies  =G.enemies.filter(e=>e.hp>0);
  G.gems     =G.gems.filter(g=>!g.dead&&g.y<canvas.height+50);
  G.particles=G.particles.filter(p=>{p.life-=.04;p.x+=p.vx;p.y+=p.vy;return p.life>0;});

  updateUI();
}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#070912';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // stars
  for(const s of G.stars){
    ctx.globalAlpha=s.a;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  if(G.state==='menu'||G.state==='stats') return;

  const p=G.player;
  if(!p) return;

  // trail
  for(let i=0;i<p.trail.length;i++){
    const t=p.trail[i];
    ctx.globalAlpha=(i/p.trail.length)*.25;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(t.x,t.y,6*(i/p.trail.length),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // aura
  if(p.aura>0){
    ctx.globalAlpha=.07;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.aura,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=p.col;ctx.lineWidth=1;ctx.globalAlpha=.2;
    ctx.stroke();ctx.globalAlpha=1;
  }

  // player ship
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.facing||(-Math.PI/2)); // face movement direction
  ctx.shadowColor=p.col;ctx.shadowBlur=20;
  ctx.fillStyle=p.col;
  ctx.beginPath();
  ctx.moveTo(0,-18);ctx.lineTo(-10,12);ctx.lineTo(0,6);ctx.lineTo(10,12);
  ctx.closePath();ctx.fill();
  // engine glow when moving
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath();ctx.ellipse(0,14,4,7,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // shield ring
  if(p.shield>0){
    ctx.strokeStyle='#a0e8ff';ctx.lineWidth=2;ctx.globalAlpha=.6;
    ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }

  // bullets
  for(const b of G.bullets){
    ctx.save();ctx.shadowColor=b.col;ctx.shadowBlur=10;
    ctx.fillStyle=b.col;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // enemy bullets
  for(const b of G.eBullets){
    ctx.fillStyle='#ff6060';
    ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
  }

  // enemies
  for(const e of G.enemies){
    ctx.save();
    ctx.translate(e.x,e.y);
    const frozen=e.frozen>0;
    const col=frozen?'#a0e8ff':e.col;
    ctx.shadowColor=col;
    ctx.shadowBlur=e.boss?28:e.miniboss?18:10;
    ctx.globalAlpha=e.type==='ghost'?(e.alpha||1):1;

    if(e.type==='grunt'){
      // Simple circle with spikes
      ctx.rotate(e.angle*.6);
      ctx.fillStyle=col;
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3;
        ctx.beginPath();ctx.arc(Math.cos(a)*e.r*.6,Math.sin(a)*e.r*.6,e.r*.4,0,Math.PI*2);ctx.fill();
      }

    } else if(e.type==='brute'){
      // Hexagon
      ctx.rotate(e.angle*.2);
      ctx.fillStyle=col;
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r);}
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.stroke();

    } else if(e.type==='dasher'){
      // Diamond/rhombus
      ctx.rotate(e.dashAngle||0);
      ctx.fillStyle=col;
      ctx.beginPath();ctx.moveTo(e.r*1.4,0);ctx.lineTo(0,e.r*.8);ctx.lineTo(-e.r*.8,0);ctx.lineTo(0,-e.r*.8);ctx.closePath();ctx.fill();

    } else if(e.type==='shooter'){
      // Cross shape
      ctx.rotate(e.angle*.4);
      ctx.fillStyle=col;
      for(let i=0;i<4;i++){
        ctx.save();ctx.rotate(i*Math.PI/2);
        ctx.fillRect(-e.r*.25,-e.r,e.r*.5,e.r*2);
        ctx.restore();
      }

    } else if(e.type==='charger'){
      // Arrow pointing direction
      const ca=Math.atan2(e.chargeVy||1,e.chargeVx||0);
      ctx.rotate(ca);
      ctx.fillStyle=col;
      ctx.beginPath();ctx.moveTo(e.r*1.5,0);ctx.lineTo(-e.r,e.r*.8);ctx.lineTo(-e.r*.4,0);ctx.lineTo(-e.r,-e.r*.8);ctx.closePath();ctx.fill();
      // wind-up flash
      if(e.chargePhase==='wind'){
        ctx.globalAlpha=.4+Math.sin(G.frame*.3)*.4;
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(0,0,e.r*1.8,0,Math.PI*2);ctx.fill();
      }

    } else if(e.type==='spinner'){
      // Star / asterisk
      ctx.rotate(e.spinAngle||0);
      ctx.fillStyle=col;
      for(let i=0;i<3;i++){
        ctx.save();ctx.rotate(i*Math.PI/3);
        ctx.fillRect(-e.r*.2,-e.r,e.r*.4,e.r*2);
        ctx.restore();
      }
      ctx.beginPath();ctx.arc(0,0,e.r*.5,0,Math.PI*2);ctx.fill();

    } else if(e.type==='titan'){
      // Big spiky circle
      ctx.rotate(e.angle*.15);
      ctx.fillStyle=col;
      ctx.beginPath();
      for(let i=0;i<12;i++){
        const a=i*Math.PI/6;
        const r2=i%2===0?e.r:e.r*.65;
        i===0?ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2):ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
      }
      ctx.closePath();ctx.fill();
      // inner core
      ctx.fillStyle='rgba(255,255,255,.2)';
      ctx.beginPath();ctx.arc(0,0,e.r*.4,0,Math.PI*2);ctx.fill();

    } else if(e.type==='hydra'){
      // Three lobes
      ctx.rotate(e.angle*.1);
      ctx.fillStyle=col;
      for(let i=0;i<3;i++){
        const a=i*Math.PI*2/3;
        ctx.beginPath();ctx.arc(Math.cos(a)*e.r*.5,Math.sin(a)*e.r*.5,e.r*.65,0,Math.PI*2);ctx.fill();
      }

    } else if(e.type==='ghost'){
      // Wispy shape
      ctx.rotate(Math.sin(G.frame*.02)*0.3);
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(0,-e.r*.1,e.r*.9,Math.PI,0);
      ctx.lineTo(e.r*.9,e.r*.4);
      for(let i=0;i<4;i++){ctx.quadraticCurveTo(e.r*(.75-i*.45),e.r*.8,e.r*(.45-i*.45),e.r*.4);}
      ctx.lineTo(-e.r*.9,e.r*.4);ctx.closePath();ctx.fill();
      // eyes
      ctx.fillStyle='rgba(0,0,0,.6)';
      ctx.beginPath();ctx.arc(-e.r*.3,-e.r*.1,e.r*.18,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e.r*.3,-e.r*.1,e.r*.18,0,Math.PI*2);ctx.fill();

    } else {
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();

    // HP bar (always world-space)
    if(e.hp<e.maxHp){
      const bw=e.r*2+8;
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(e.x-bw/2,e.y+e.r+5,bw,5);
      const hcol=e.boss?'#f87171':e.miniboss?'#fb923c':'#4ade80';
      ctx.fillStyle=hcol;ctx.fillRect(e.x-bw/2,e.y+e.r+5,bw*(e.hp/e.maxHp),5);
    }
    // Boss/miniboss name tag
    if(e.boss||e.miniboss){
      ctx.fillStyle=e.boss?'#fca5a5':'#fdba74';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
      ctx.fillText(e.boss?(e.type.toUpperCase()+' BOSS'):('MINI-'+e.type.toUpperCase()),e.x,e.y-e.r-10);
    }
  }

  // gems
  for(const g of G.gems){
    ctx.save();
    ctx.shadowColor=g.col;ctx.shadowBlur=10;
    ctx.fillStyle=g.col;
    if(g.type==='credit'){
      // Coin: circle with C
      g.spin=(g.spin||0)+.08;
      const scaleX=Math.abs(Math.cos(g.spin));
      ctx.translate(g.x,g.y);ctx.scale(scaleX,1);
      ctx.beginPath();ctx.arc(0,0,g.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('$',0,0);
    } else {
      // XP gem as diamond, bigger = higher tier
      ctx.translate(g.x,g.y);
      ctx.beginPath();
      ctx.moveTo(0,-g.r);ctx.lineTo(g.r*.7,0);ctx.lineTo(0,g.r);ctx.lineTo(-g.r*.7,0);
      ctx.closePath();ctx.fill();
      // shimmer on high-tier
      if(g.r>=8){
        ctx.globalAlpha=.4;ctx.fillStyle='#fff';
        ctx.beginPath();ctx.moveTo(0,-g.r*.6);ctx.lineTo(g.r*.3,0);ctx.lineTo(0,-g.r*.1);ctx.closePath();ctx.fill();
      }
    }
    ctx.restore();
  }

  // particles
  for(const pt of G.particles){
    ctx.globalAlpha=pt.life;ctx.fillStyle=pt.col;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // joystick
  if(window._joyDraw) window._joyDraw(ctx);
}

// ── UI ────────────────────────────────────────────────────────────────────────
function updateUI(){
  const p=G.player||{hp:100,maxHp:100,shield:0};
  document.getElementById('scoreText').textContent=Math.floor(G.score);
  document.getElementById('waveText').textContent=G.wave;
  document.getElementById('levelText').textContent=G.level;
  document.getElementById('creditText').textContent=Math.floor(meta.bankCredits);
  document.getElementById('hpBar').style.width=(p.hp/p.maxHp*100)+'%';
  document.getElementById('xpBar').style.width=(G.xp/G.xpNext*100)+'%';
}

// ── HANGAR ────────────────────────────────────────────────────────────────────
function renderHangar(){
  document.getElementById('hangarCredits').textContent=Math.floor(meta.bankCredits);
  const grid=document.getElementById('skinGrid');
  grid.innerHTML='';
  for(const s of SKINS){
    const card=document.createElement('div');
    card.className='skin-card'+(meta.selectedSkin===s.id?' active':'');
    card.innerHTML=`<div class="skin-color" style="background:${s.col};color:${s.col}"></div>
      <div style="font-size:13px;font-weight:600">${s.name}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:3px">${s.owned?'Куплено':s.price+' кр.'}</div>`;
    card.addEventListener('click',()=>{
      if(!s.owned){
        if(meta.bankCredits<s.price){toast('Не хватает кредитов!');return;}
        meta.bankCredits-=s.price;s.owned=true;
      }
      meta.selectedSkin=s.id;
      renderHangar();
    });
    grid.appendChild(card);
  }
}

// ── END RUN ───────────────────────────────────────────────────────────────────
function endRun(){
  G.state='stats';
  meta.bankCredits+=Math.floor(G.runCredits);

  const params=new URLSearchParams(window.location.search);
  const uid=params.get('uid');
  const cid=params.get('cid');
  const token=params.get('token');
  const rawName=params.get('name');
  const playerName=rawName?decodeURIComponent(rawName):'Игрок';

  // Show stats screen
  document.getElementById('statsName').textContent='👤 '+playerName;
  document.getElementById('statsScore').textContent=Math.floor(G.score)+' очков';
  document.getElementById('statsWave').textContent=G.wave;
  document.getElementById('statsLevel').textContent=G.level;
  document.getElementById('statsCredits').textContent='+'+Math.floor(G.runCredits);

  // Active upgrades tags
  const tagNames={homing:'🎯 Самонаводящиеся',glass:'💎 Стеклянная пушка'};
  const tags=[...G.player.tags].map(t=>tagNames[t]||t);
  if(G.player.pierce>0) tags.unshift('🔷 Пробитие '+G.player.pierce);
  if(G.player.ricochet>0) tags.unshift('↩️ Рикошет '+G.player.ricochet);
  if(G.player.extraShots>0) tags.unshift('🔫 Пуль ×'+(G.player.extraShots+1));
  if(G.player.drone>0) tags.unshift('🤖 Дроны '+G.player.drone);
  const tagsEl=document.getElementById('statsTags');
  tagsEl.innerHTML=tags.map(t=>`<span class="upg-tag">${t}</span>`).join('');

  document.getElementById('overlayStats').classList.remove('hidden');

  // Send to Telegram
  if(uid&&cid&&token){
    fetch('https://api.telegram.org/bot'+token+'/sendMessage',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        chat_id:cid,parse_mode:'HTML',
        text:'🎮 <b>'+playerName+'</b> набрал <b>'+Math.floor(G.score)+'</b> очков\n🌊 Волна: <b>'+G.wave+'</b>\n\n/top — таблица рекордов'
      })
    }).catch(()=>{});
    // Score for leaderboard
    fetch('https://api.telegram.org/bot'+token+'/sendMessage',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:uid,text:'__score__'+uid+'|'+playerName+'|'+Math.floor(G.score)+'|'+G.wave})
    }).catch(()=>{});
  }
}

// ── GAME LOOP ─────────────────────────────────────────────────────────────────
let lastT=0;
function loop(t){
  const dt=lastT?Math.min((t-lastT)/16.667,1.5):1;
  lastT=t;
  window._dt=dt;
  update();
  draw();
  requestAnimationFrame(loop);
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  G.keys[e.key.toLowerCase()]=true;
  if(e.key==='Escape'){
    if(G.state==='playing'){G.state='pause';document.getElementById('overlayPause').classList.remove('hidden');}
    else if(G.state==='pause'){G.state='playing';document.getElementById('overlayPause').classList.add('hidden');}
  }
});
document.addEventListener('keyup',e=>{G.keys[e.key.toLowerCase()]=false;});

// Mouse / touch shoot target
// Auto-aim: no mouse targeting needed

// ── JOYSTICK ──────────────────────────────────────────────────────────────────
(function(){
  const R=45,TR=20;
  let active=false,tid=null,bx=0,by=0,tx=0,ty=0,jx=0,jy=0;
  function inZone(cx,cy){return cx<window.innerWidth*.55&&cy>window.innerHeight*.45;}
  function updateThumb(cx,cy){
    let dx=cx-bx,dy=cy-by;
    const l=Math.hypot(dx,dy);
    if(l>R){dx=dx/l*R;dy=dy/l*R;}
    tx=bx+dx;ty=by+dy;jx=dx/R;jy=dy/R;
  }
  document.addEventListener('touchstart',e=>{
    if(G.state!=='playing') return;
    for(const t of e.changedTouches){
      if(tid===null&&inZone(t.clientX,t.clientY)){
        tid=t.identifier;active=true;
        bx=t.clientX;by=t.clientY;tx=bx;ty=by;jx=0;jy=0;
        e.preventDefault();break;
      }
    }
  },{passive:false});
  document.addEventListener('touchmove',e=>{
    for(const t of e.changedTouches){if(t.identifier===tid){updateThumb(t.clientX,t.clientY);e.preventDefault();break;}}
  },{passive:false});
  function onEnd(e){for(const t of e.changedTouches){if(t.identifier===tid){tid=null;active=false;jx=0;jy=0;break;}}}
  document.addEventListener('touchend',onEnd,{passive:false});
  document.addEventListener('touchcancel',onEnd,{passive:false});
  window._jx=()=>jx;window._jy=()=>jy;
  window._joyDraw=function(c){
    const BY=canvas.height-100;
    const dbx=active?bx:80,dby=active?by:BY;
    const dtx=active?tx:80,dty=active?ty:BY;
    c.save();c.globalAlpha=.5;
    c.beginPath();c.arc(dbx,dby,R,0,Math.PI*2);
    c.strokeStyle='rgba(46,216,255,.5)';c.lineWidth=2;c.stroke();
    c.fillStyle='rgba(46,216,255,.08)';c.fill();
    c.beginPath();c.arc(dtx,dty,TR,0,Math.PI*2);
    c.fillStyle=active?'rgba(46,216,255,.7)':'rgba(46,216,255,.3)';c.fill();
    c.restore();
  };
})();

// ── BUTTON HANDLERS ───────────────────────────────────────────────────────────
function startGame(){
  resetRun();
  G.state='playing';
  document.getElementById('overlayMenu').classList.add('hidden');
  document.getElementById('overlayPause').classList.add('hidden');
  document.getElementById('overlayUpgrade').classList.add('hidden');
  document.getElementById('overlayStats').classList.add('hidden');
  toast('Забег начался');
}

function openHangar(){
  renderHangar();
  document.getElementById('overlayHangar').classList.remove('hidden');
}

function closeHangar(){
  document.getElementById('overlayHangar').classList.add('hidden');
}

document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnHangar2').addEventListener('click', openHangar);
document.getElementById('btnHangar').addEventListener('click', openHangar);
document.getElementById('btnHangarClose').addEventListener('click', closeHangar);
document.getElementById('btnResume').addEventListener('click',()=>{
  G.state='playing';
  document.getElementById('overlayPause').classList.add('hidden');
});
document.getElementById('btnPauseHangar').addEventListener('click', openHangar);
document.getElementById('btnStatsRestart').addEventListener('click',()=>{
  document.getElementById('overlayStats').classList.add('hidden');
  startGame();
});
document.getElementById('btnStatsMenu').addEventListener('click',()=>{
  document.getElementById('overlayStats').classList.add('hidden');
  G.state='menu';
  document.getElementById('overlayMenu').classList.remove('hidden');
});
document.getElementById('btnReroll').addEventListener('click',()=>{
  if(G.rerolls>0){
    G.rerolls--;
    const cards=pickUpgrades();
    document.getElementById('rerollCount').textContent=G.rerolls;
    const container=document.getElementById('upgradeCards');
    container.innerHTML='';
    for(const u of cards){
      const div=document.createElement('div');
      div.className='card';
      div.innerHTML=`<div class="rarity-${u.rar}" style="font-size:10px;letter-spacing:.1em">${u.rar.toUpperCase()}</div>
        <h3>${u.name}</h3><p>${u.desc}</p>`;
      const btn=document.createElement('button');
      btn.className='btn-primary';
      btn.style.cssText='width:100%;margin-top:8px;padding:8px';
      btn.textContent='Выбрать';
      btn.addEventListener('click',()=>{
        u.apply(G.player);
        if(G.player.maxShield&&G.player.shield<1)G.player.shield=1;
        document.getElementById('overlayUpgrade').classList.add('hidden');
        G.state='playing';
        toast(u.name);
      });
      div.appendChild(btn);
      container.appendChild(div);
    }
  } else {toast('Реролл недоступен!');}
});

// ── INIT ──────────────────────────────────────────────────────────────────────
initStars();
updateUI();
requestAnimationFrame(loop);
</script>
